# vLogin — textos em português
#
# Cores com & (ex.: &a) ou &#RRGGBB para hexadecimal, a partir da 1.16.
# O que estiver entre chaves é substituído pelo plugin: {player}, {min}...
# \n quebra a linha, o que serve nas telas de desconexão.
#
# Apagar uma linha não quebra nada: o texto embutido entra no lugar.

prefix: "&8[&bvLogin&8] &r"

# entrada e cadastro
auth:
  register-request: "&fCrie sua senha para entrar&7: &b/registrar <senha> <senha>"
  register-title: "&b&lCRIE SUA SENHA"
  register-subtitle: "&7digite &f/registrar <senha> <senha>"
  registered: "&aPronto! Sua senha foi criada."
  already-registered: "&cVocê já tem uma senha criada."
  register-linked: "&cEste nickname pertence a uma conta original ou Bedrock.\n&7Entre por ela para poder criar uma senha aqui."
  password-mismatch: "&cAs duas senhas precisam ser iguais."
  register-usage: "&cFaltou repetir a senha&7: &b/registrar <senha> <senha>"
  register-address-limit: "&cEste endereço já tem &b{limit} &ccontas."
  login-request: "&fEntre com sua senha&7: &b/logar <senha>"
  login-title: "&b&lENTRE COM SUA SENHA"
  login-subtitle: "&7digite &f/logar <senha>"
  logged-in: "&aBem-vindo de volta!"
  already-logged: "&cVocê já entrou."
  not-registered: "&cEste nickname ainda não tem senha criada."
