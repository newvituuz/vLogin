  bedrock-auto: "&aConta Xbox confirmada, sem senha desta vez."
  logged-out: "&aSaímos da sua conta. Entre de novo quando quiser."

# regras de senha
password:
  changed: "&aSenha trocada."
  change-usage: "&cInforme a senha de agora e a nova&7: &b/trocarsenha <atual> <nova>"
  wrong-current: "&cA senha de agora não confere."
  too-short: "&cA senha ficou curta. &7Mínimo de &b{min} &7caracteres."
  too-long: "&cA senha ficou longa. &7Máximo de &b{max} &7caracteres."
